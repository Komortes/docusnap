name: docusnap-docs

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docusnap-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-smoke:
    name: Test And Smoke Generate Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Smoke generate snapshot and docs
        run: go run ./cmd/docusnap run --path . --snapshot /tmp/docusnap-snapshot.json --docs /tmp/docusnap-docs --format both
